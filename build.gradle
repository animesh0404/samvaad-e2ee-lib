plugins {
    id 'java-library'
}

group = 'com.samvaad'
version = '0.1.0'

// The repository/root project is named `samvaad-e2ee-lib`, but the library
// module identity stays `com.samvaad:e2ee-client`. Composite-build
// dependency substitution matches on group + archives base name, so this
// lets consumers declare `com.samvaad:e2ee-client:0.1.0` with a plain
// `includeBuild` and no consumer-side substitution rule. It also keeps the
// built jar (`e2ee-client-0.1.0.jar`) and any future Maven publication
// artifactId on the frozen coordinate.
base {
    archivesName = 'e2ee-client'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Real V1 Signal/Sesame crypto (server ADR-0018): libsignal-client behind
    // the Samvaad-owned SignalAdapter seam. Only LibSignalAdapter may
    // reference library types, so `implementation` (not `api`) is sufficient.
    // Pinned to 0.86.5: the newest version published to Maven Central
    // (later 0.10x lines are not on Central) and the line validated on
    // Java 25. No Spring, no Jackson, no JPA: plain JVM library, JDK-only
    // persistence/vault/fingerprint code.
    implementation 'org.signal:libsignal-client:0.86.5'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform()
}
