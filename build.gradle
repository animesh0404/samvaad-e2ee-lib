plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.samvaad'
version = '0.1.0'

// The repository/root project is named `samvaad-e2ee-lib`, but the library
// coordinates stay `com.samvaad:e2ee-client:0.1.0`. Composite-build
// dependency substitution matches on the module/project identity (group +
// project name), not on `base.archivesName`, so the default substitution
// does not map `com.samvaad:e2ee-client` to this build; consumers use an
// explicit rule (see `substitute(module('com.samvaad:e2ee-client'))` in
// `samvaad-server/server/settings.gradle`). `base.archivesName` only keeps
// the built jar (`e2ee-client-0.1.0.jar`) on the frozen coordinate; the
// published Maven artifactId is pinned explicitly in the `e2eeClient`
// publication below (it defaults to the project name otherwise).
base {
    archivesName = 'e2ee-client'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Real V1 Signal/Sesame crypto (server ADR-0018): libsignal-client behind
    // the Samvaad-owned SignalAdapter seam. Only LibSignalAdapter may
    // reference library types, so `implementation` (not `api`) is sufficient.
    // Pinned to 0.86.5: the newest version published to Maven Central
    // (later 0.10x lines are not on Central) and the line validated on
    // Java 25. No Spring, no Jackson, no JPA: plain JVM library, JDK-only
    // persistence/vault/fingerprint code.
    implementation 'org.signal:libsignal-client:0.86.5'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform()
}

// GitHub Packages publication (ADR 0002). Publishes the frozen coordinate
// `com.samvaad:e2ee-client:0.1.0` to
// `https://maven.pkg.github.com/animesh0404/samvaad-e2ee-lib`.
// `artifactId` is pinned explicitly because the Gradle project name
// (`samvaad-e2ee-lib`) intentionally differs from the Maven artifact.
// Credentials come only from the environment (`GITHUB_ACTOR` /
// `GITHUB_TOKEN`); no token is ever hardcoded. Publication itself runs in
// GitHub Actions on an explicit GitHub Release (see
// `.github/workflows/publish.yml`), never automatically on push.
publishing {
    publications {
        e2eeClient(MavenPublication) {
            from components.java
            groupId = 'com.samvaad'
            artifactId = 'e2ee-client'
            version = '0.1.0'
            pom {
                name = 'Samvaad E2EE client library'
                description = 'Reusable JVM client-side end-to-end encryption (E2EE) implementation for Samvaad V1 one-to-one messaging.'
                url = 'https://github.com/animesh0404/samvaad-e2ee-lib'
                licenses {
                    license {
                        name = 'GNU Affero General Public License v3.0 only'
                        url = 'https://www.gnu.org/licenses/agpl-3.0.html'
                    }
                }
                developers {
                    developer {
                        id = 'animesh0404'
                        name = 'Animesh Kahara'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/animesh0404/samvaad-e2ee-lib.git'
                    developerConnection = 'scm:git:ssh://github.com/animesh0404/samvaad-e2ee-lib.git'
                    url = 'https://github.com/animesh0404/samvaad-e2ee-lib'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/animesh0404/samvaad-e2ee-lib')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
